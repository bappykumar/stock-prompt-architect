<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROMPT MASTER - Professional Stock Prompt Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              },
              brand: {
                navy: '#0b1120',
                card: '#111827',
                border: '#1f2937'
              }
            },
            fontFamily: {
              sans: ['"Inter"', 'system-ui', 'sans-serif'],
            },
            letterSpacing: {
              tightest: '-.075em',
              tighter: '-.05em',
            },
            screens: {
              xs: '420px',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      
      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #f6f8fc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      .dark body {
        background-color: #070b14;
        color: #f8fafc;
      }

      /* Apple Liquid Glass System Styles */
      .apple-liquid-glass {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.60) 50%, rgba(255, 255, 255, 0.48) 100%);
        backdrop-filter: blur(28px) saturate(190%) brightness(103%);
        -webkit-backdrop-filter: blur(28px) saturate(190%) brightness(103%);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.08),
                    0 1px 3px rgba(0, 0, 0, 0.04),
                    inset 0 1px 1px 0 rgba(255, 255, 255, 0.85);
      }

      .dark .apple-liquid-glass {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.78) 0%, rgba(15, 23, 42, 0.65) 50%, rgba(2, 6, 23, 0.80) 100%);
        backdrop-filter: blur(28px) saturate(190%) brightness(95%);
        -webkit-backdrop-filter: blur(28px) saturate(190%) brightness(95%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.7),
                    0 1px 2px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 0 rgba(255, 255, 255, 0.14);
      }

      /* Line Clamp 2 */
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Ultra-thin Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 20px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #1e293b;
      }

      /* Entrance Animation (ONLY for Welcome Section) */
      .animate-welcome-reveal {
        animation: welcome-reveal 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      @keyframes welcome-reveal {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Button Hover Transitions - avoid overriding switches and custom components */
      button:not([role="switch"]):not(.no-global-transition), select, input, .card-hover {
        transition: all 0.2s ease;
      }

      /* Apple Fluid Switch System */
      .apple-switch-track {
        transition: background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease !important;
      }
      .apple-switch-thumb {
        transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        will-change: transform;
      }
      
      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      .dark ::selection {
        background: #3b82f6;
        color: #ffffff;
      }
    </style>

  }
}
</script>
