<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROMPT MASTER - Professional Stock Prompt Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              },
              brand: {
                navy: '#0b1120',
                card: '#111827',
                border: '#1f2937'
              }
            },
            fontFamily: {
              sans: ['"Inter"', 'system-ui', 'sans-serif'],
            },
            letterSpacing: {
              tightest: '-.075em',
              tighter: '-.05em',
            },
            screens: {
              xs: '420px',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      
      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #f6f8fc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      .dark body {
        background-color: #070b14;
        color: #f8fafc;
      }

      /* Apple Liquid Glass System Styles */
      .apple-liquid-glass {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.60) 50%, rgba(255, 255, 255, 0.48) 100%);
        backdrop-filter: blur(28px) saturate(190%) brightness(103%);
        -webkit-backdrop-filter: blur(28px) saturate(190%) brightness(103%);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.08),
                    0 1px 3px rgba(0, 0, 0, 0.04),
                    inset 0 1px 1px 0 rgba(255, 255, 255, 0.85);
      }

      .dark .apple-liquid-glass {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.78) 0%, rgba(15, 23, 42, 0.65) 50%, rgba(2, 6, 23, 0.80) 100%);
        backdrop-filter: blur(28px) saturate(190%) brightness(95%);
        -webkit-backdrop-filter: blur(28px) saturate(190%) brightness(95%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.7),
                    0 1px 2px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 0 rgba(255, 255, 255, 0.14);
      }

      /* Line Clamp 2 */
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Ultra-thin Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 20px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #1e293b;
      }

      /* Entrance Animation (ONLY for Welcome Section) */
      .animate-welcome-reveal {
        animation: welcome-reveal 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      @keyframes welcome-reveal {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Button Hover Transitions - avoid overriding switches and custom components */
      button:not([role="switch"]):not(.no-global-transition), select, input, .card-hover {
        transition: all 0.2s ease;
      }

      /* Apple Fluid Switch System */
      .apple-switch-track {
        transition: background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease !important;
      }
      .apple-switch-thumb {
        transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        will-change: transform;
      }
      
      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      /* ========================================================
         Modern Quantum Orbital Core & Scanner Animations 
         ======================================================== */
      @keyframes quantum-orbit-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes quantum-orbit-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes quantum-orbit-ellipse-cw {
        from { transform: rotate(38deg); }
        to { transform: rotate(398deg); }
      }
      @keyframes quantum-orbit-ellipse-ccw {
        from { transform: rotate(-32deg); }
        to { transform: rotate(-392deg); }
      }
      @keyframes quantum-neural-pulse {
        0%, 100% {
          transform: scale(0.92);
          opacity: 0.85;
          filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4));
        }
        50% {
          transform: scale(1.12);
          opacity: 1;
          filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.85));
        }
      }

      .quantum-orbit-cw {
        animation: quantum-orbit-cw 5.5s linear infinite;
        transform-origin: 50px 50px;
      }
      .quantum-orbit-ellipse-ccw {
        animation: quantum-orbit-ellipse-ccw 4.2s linear infinite;
        transform-origin: 50px 50px;
      }
      .quantum-orbit-ellipse-cw {
        animation: quantum-orbit-ellipse-cw 3.6s linear infinite;
        transform-origin: 50px 50px;
      }
      .quantum-orbit-ccw-fast {
        animation: quantum-orbit-ccw 2.6s linear infinite;
        transform-origin: 50px 50px;
      }
      .quantum-neural-pulse {
        animation: quantum-neural-pulse 1.8s ease-in-out infinite;
        transform-origin: 50px 50px;
      }

      /* Glowing horizontal scanner beam sweeping across diagnostic card */
      @keyframes quantum-scanner-sweep {
        0% {
          top: -2%;
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          top: 102%;
          opacity: 0;
        }
      }
      .quantum-scanner-beam {
        animation: quantum-scanner-sweep 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: top, opacity;
      }

      /* Smooth spring scale & fade with subtle frosted blur reveal */
      @keyframes diagnostic-reveal {
        0% {
          opacity: 0;
          transform: scale(0.92) translateY(10px);
          filter: blur(8px);
        }
        70% {
          opacity: 1;
          transform: scale(1.012) translateY(-1px);
          filter: blur(0px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0px);
        }
      }
      .diagnostic-card-reveal {
        animation: diagnostic-reveal 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity, filter;
      }

      /* ========================================================
         Quantum Orbital Button & Particle Stream Animations
         ======================================================== */
      @keyframes quantum-btn-border-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .quantum-btn-border-spin {
        animation: quantum-btn-border-spin 4s linear infinite;
        will-change: transform;
      }
      .quantum-btn-border-spin-fast {
        animation: quantum-btn-border-spin 2s linear infinite;
        will-change: transform;
      }

      @keyframes quantum-stream-slide-left {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-100px, 0, 0); }
      }
      .animate-quantum-stream-left {
        animation: quantum-stream-slide-left 1.8s linear infinite;
        will-change: transform;
      }

      @keyframes quantum-stream-slide-right {
        0% { transform: translate3d(-100px, 0, 0); }
        100% { transform: translate3d(0, 0, 0); }
      }
      .animate-quantum-stream-right {
        animation: quantum-stream-slide-right 2.4s linear infinite;
        will-change: transform;
      }

      @keyframes quantum-flash-expand {
        0% {
          transform: scale(0.6);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.7);
          opacity: 0;
        }
      }
      .quantum-flash-expand {
        animation: quantum-flash-expand 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity;
      }

      @keyframes quantum-check-spring {
        0% {
          transform: scale(0.4) rotate(-20deg);
          opacity: 0;
        }
        70% {
          transform: scale(1.15) rotate(4deg);
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }
      .quantum-check-spring {
        animation: quantum-check-spring 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        will-change: transform, opacity;
      }

      .dark ::selection {
        background: #3b82f6;
        color: #ffffff;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root" class="min-h-screen"></div>

  </body>
</html>
